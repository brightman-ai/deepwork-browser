<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes workspace</title>
<style>
body{font:17px/1.5 system-ui;margin:0;background:#f6f4ef;color:#202a24}main{max-width:760px;margin:40px auto;padding:28px;background:white;border-radius:12px}nav{display:flex;gap:20px;margin-bottom:20px}label{display:block;margin-bottom:6px}textarea{font:inherit;width:100%;box-sizing:border-box;min-height:160px;padding:12px}button{font:inherit;margin:16px 0;padding:9px 20px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#feedback{min-height:28px}@media(max-width:900px){main{margin:12px;padding:20px}}
</style>
<main>
<h1>Notes workspace</h1>
<nav><a href="#edit" id="edit-link">Edit note</a><a href="#saved" id="saved-link">Open saved note</a></nav>
<section id="edit">
<h2>Edit meeting note</h2>
<form id="note-form"><label for="draft">Draft note</label>
<textarea id="draft" data-testid="draft">Original meeting note.
The next review is on Friday.</textarea>
<button type="submit" data-testid="save">Save note</button></form>
<p id="feedback" role="status"></p>
</section>
<section id="saved" hidden><h2>Saved meeting note</h2><pre id="saved-text"></pre><a href="#edit">Return to editing</a></section>
</main>
<script>
const draft=document.getElementById('draft');
const stored=localStorage.getItem('meeting-note');
if(stored!==null)draft.value=stored;
function render(){const saved=location.hash==='#saved';document.getElementById('edit').hidden=saved;document.getElementById('saved').hidden=!saved;document.getElementById('saved-text').textContent=localStorage.getItem('meeting-note')||'No note has been saved yet.';}
document.getElementById('note-form').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('meeting-note',draft.value);document.getElementById('feedback').textContent='Note saved.';});
addEventListener('hashchange',render);render();
</script>
</html>
