version: 2
id: BROWSERACT-ARTICLE-AUTHORED-001
name: BrowserAct article — authored remote-assist workflow
app: deepwork-browser
portal: local-fixture
risk_tags: [deterministic, chinese-content, interaction]
environment:
  base_url: http://127.0.0.1:18765
  entry_url: /
  mode: headless
  viewport: "1440x1000"
  client: chrome
  clean_session: true
journey:
  # Historical nl-step filename retained for callers. A caller authors this
  # typed plan; the baseline runner performs no natural-language planning.
  - id: filter-remote-assist
    kind: action
    mode: visual
    action:
      kind: fill
      target:
        kind: locator
        locator: "css=[data-testid='search-box']"
      text: 'remote-assist'
  - id: await-one-related-card
    kind: wait
    probes:
      - id: filter-status
        kind: css
        selector: "[data-testid='filter-status']"
    wait:
      assert: "probe_text_contains(id='filter-status',text='当前显示 1 个能力项')"
      timeout_ms: 10000
  - id: remote-assist-visible
    kind: check
    check:
      - assert: "region_non_empty('card-remote-assist')"
        using: [layout]
        required: true
  - id: generate-summary
    kind: action
    mode: visual
    action:
      kind: click
      target:
        kind: locator
        locator: "css=[data-testid='copy-summary']"
  - id: await-generated-summary
    kind: wait
    wait:
      assert: "region_non_empty('summary-output')"
      timeout_ms: 10000
  - id: generated-summary
    kind: check
    check:
      - assert: "region_non_empty('summary-output')"
        using: [layout]
        required: true
evidence:
  save: [trace, observation, screenshot, report, replay]
