version: 2
id: BROWSERACT-ARTICLE-A11Y-001
name: BrowserAct article — deterministic controls and rendered facts
app: deepwork-browser
portal: local-fixture
risk_tags: [deterministic, chinese-content, interaction]
environment:
  base_url: http://127.0.0.1:18765
  entry_url: /
  mode: headless
  viewport: "1440x1000"
  client: chrome
  clean_session: true
journey:
  # Plain article cards are not interactive refs. Layout assertions prove that
  # filtering leaves the exact cards rendered. Telemetry is not asserted as zero
  # before a collector has evidence for the initial page load.
  - id: observe-article
    kind: observe
  - id: title
    kind: check
    check:
      - assert: "region_non_empty('article-title')"
        using: [layout]
        required: true
  - id: search
    kind: check
    check:
      - assert: "exists(testid='search-box')"
        using: [structural]
        required: true
  - id: extract
    kind: check
    check:
      - assert: "region_non_empty('card-stealth-extract')"
        using: [layout]
        required: true
  - id: summary-button
    kind: check
    check:
      - assert: "exists(testid='copy-summary')"
        using: [structural]
        required: true
  - id: filter-dynamic-proxy
    kind: action
    mode: visual
    action:
      kind: fill
      target:
        kind: locator
        locator: "css=[data-testid='search-box']"
      text: '动态代理'
  - id: await-proxy
    kind: wait
    wait:
      assert: "region_non_empty('card-proxy')"
      timeout_ms: 10000
  - id: filter-status
    kind: check
    check:
      - assert: "region_non_empty('filter-status')"
        using: [layout]
        required: true
  - id: clear-keyword-filter
    kind: action
    mode: visual
    action:
      kind: fill
      target:
        kind: locator
        locator: "css=[data-testid='search-box']"
      text: ''
  - id: await-stealth
    kind: wait
    wait:
      assert: "region_non_empty('card-stealth')"
      timeout_ms: 10000
  - id: switch-human-layer
    kind: action
    mode: visual
    action:
      kind: click
      target:
        kind: locator
        locator: "css=[data-testid='btn-layer-human']"
  - id: await-remote-assist
    kind: wait
    wait:
      assert: "region_non_empty('card-remote-assist')"
      timeout_ms: 10000
  - id: skill-forge
    kind: check
    check:
      - assert: "region_non_empty('card-skill-forge')"
        using: [layout]
        required: true
  - id: generate-summary
    kind: action
    mode: visual
    action:
      kind: click
      target:
        kind: locator
        locator: "css=[data-testid='copy-summary']"
  - id: await-generated-summary
    kind: wait
    wait:
      assert: "region_non_empty('summary-output')"
      timeout_ms: 10000
  - id: generated-summary
    kind: check
    check:
      - assert: "region_non_empty('summary-output')"
        using: [layout]
        required: true
evidence:
  save: [trace, observation, screenshot, report, replay]
