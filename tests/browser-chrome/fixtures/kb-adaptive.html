<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb-adaptive — 键盘态钉高（真机正常，仿真不得误报）</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  #app { display: flex; flex-direction: column; height: 100vh; /* JS 用 vv.height 覆写 */ }
  header { padding: 12px 16px; background: #7c3aed; color: #fff; font: 600 16px system-ui; }
  main { flex: 1; overflow: auto; padding: 16px; font: 14px system-ui; color: #333; background: #faf5ff; }
  #composer {
    display: flex; gap: 8px; padding: 10px 12px;
    background: #fff; border-top: 1px solid #e9d5ff;
  }
  #msg {
    flex: 1; padding: 12px; border: 1px solid #d8b4fe; border-radius: 10px;
    font: 14px system-ui; color: #333;
  }
  #btn-send {
    padding: 12px 20px; border: 0; border-radius: 10px;
    background: #7c3aed; color: #fff; font: 600 14px system-ui;
  }
</style>
</head>
<body>
<div id="app">
  <header>kb-adaptive 聊天</header>
  <main id="log">此页用 visualViewport.height 钉住 #app 高度并监听 resize/scroll——
    与真机 Safari 自适应页同构。软键盘弹起时 composer 条自动上浮到键盘上方，
    始终可见可用。</main>
  <div id="composer">
    <label for="msg" class="sr-only">消息输入</label>
    <input id="msg" type="text" placeholder="输入消息…">
    <button id="btn-send" onclick="document.getElementById('log').textContent='sent@'+Date.now()">发送</button>
  </div>
</div>
<script>
  const app = document.getElementById('app');
  function fit() {
    const vv = window.visualViewport;
    if (!vv) return;
    app.style.height = vv.height + 'px';
  }
  fit();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fit);
    window.visualViewport.addEventListener('scroll', fit);
  }
</script>
</body>
</html>
