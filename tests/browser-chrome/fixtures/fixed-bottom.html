<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fixed-bottom — position:fixed 底锚页（真机可见，豁免降级不误拦）</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font: 14px system-ui; color: #333; }
  header { padding: 12px 16px; background: #d97706; color: #fff; font: 600 16px system-ui; }
  main { padding: 16px 16px 96px; }
  #toolbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; gap: 8px; padding: 10px 12px;
    background: #fff; border-top: 1px solid #fde68a;
  }
  #toolbar button {
    flex: 1; padding: 12px 0; border: 0; border-radius: 10px;
    background: #d97706; color: #fff; font: 600 14px system-ui;
  }
</style>
</head>
<body>
<header>fixed-bottom 工具页</header>
<main>此页底部工具条用 position:fixed; bottom:0（无 dvh/safe-area 声明）——
  真机 bars-expanded 时 layout viewport = svh，fixed 元素锚定其底边、在 Safari 底栏
  上方完全可见。仿真的双视口模型把 layout 钉在 lvh（引擎约束），fixed 元素看似沉入
  遮挡带 = 残留假阳——act 应豁免放行、audit 应降级注记（fixed-anchored）而非 fail。</main>
<div id="toolbar">
  <button id="btn-a">操作A</button>
  <button id="btn-b">操作B</button>
</div>
</body>
</html>
