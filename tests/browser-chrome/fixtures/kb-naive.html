<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kb-naive — 键盘态病灶页（适配了底栏、没适配键盘：真机被软键盘吞掉，仿真必须显形）</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px; background: #16a34a; color: #fff; font: 600 16px system-ui; }
  main { flex: 1; overflow: auto; padding: 16px; font: 14px system-ui; color: #333; background: #f0fdf4; }
  #composer {
    display: flex; gap: 8px; padding: 10px 12px;
    background: #fff; border-top: 1px solid #bbf7d0;
  }
  #msg {
    flex: 1; padding: 12px; border: 1px solid #86efac; border-radius: 10px;
    font: 14px system-ui; color: #333;
  }
  #btn-send {
    padding: 12px 20px; border: 0; border-radius: 10px;
    background: #16a34a; color: #fff; font: 600 14px system-ui;
  }
</style>
</head>
<body>
<div id="app">
  <header>kb-naive 聊天</header>
  <main>此页用 window.innerHeight 钉高（pre-visualViewport 时代的经典写法）——
    底栏适配正确（composer 在底栏上方可见可点），但 iOS 上 innerHeight 不随键盘变：
    软键盘弹起后 composer 被键盘吞掉，用户看不见自己在输入什么。
    仿真截图必须把这个遮挡显形（真机同构病灶）。</main>
  <div id="composer">
    <label for="msg" class="sr-only">消息输入</label>
    <input id="msg" type="text" placeholder="输入消息…">
    <button id="btn-send">发送</button>
  </div>
</div>
<script>
  // 经典 pre-visualViewport 写法：innerHeight 钉高 + resize 监听。
  // iOS 语义：innerHeight 随底栏/缩放、不随软键盘 —— 键盘弹起时布局不动 = 病灶。
  const app = document.getElementById('app');
  function fit() { app.style.height = window.innerHeight + 'px'; }
  fit();
  window.addEventListener('resize', fit);
</script>
</body>
</html>
