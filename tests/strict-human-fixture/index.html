<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>strict-human fidelity fixture</title>
  <style>
    body { margin: 0; font: 16px sans-serif; }
    label, input { display: block; margin: 16px; }
    input { width: 280px; height: 36px; }
    #partial { position: absolute; left: 20px; top: 140px; width: 200px; height: 100px; }
    #occluder {
      position: absolute; left: 50px; top: 150px; width: 40px; height: 30px;
      z-index: 5; background: rgba(255, 0, 0, .2);
    }
  </style>
</head>
<body>
  <label for="field">Human input</label>
  <input id="field" data-testid="field" aria-label="Human input" value="seed">
  <button id="partial" data-testid="partial">Partially hittable</button>
  <div id="occluder" aria-hidden="true"></div>
  <output id="clicked"></output>
  <script>
    window.__humanEvents = [];
    for (const type of ['mousedown', 'click', 'focus', 'keydown', 'keyup', 'beforeinput', 'input']) {
      document.addEventListener(type, event => window.__humanEvents.push({
        type,
        trusted: event.isTrusted,
        target: event.target && event.target.id || ''
      }), true);
    }
    partial.addEventListener('click', () => { clicked.value = 'centroid clicked'; });
  </script>
</body>
</html>
